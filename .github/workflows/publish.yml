# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Publish release version

on:
  release:
    types: [published]

jobs:
  modrinth-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.2.2
    - name: Set up JDK 21
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Set variable
      id: variables
      run: |
        echo "version=$(mvn org.apache.maven.plugins:maven-help-plugin:3.1.0:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
        echo "version_code=$(mvn org.apache.maven.plugins:maven-help-plugin:3.1.0:evaluate -Dexpression=versionCode -q -DforceStdout)" >> "$GITHUB_OUTPUT"

    - name: Download release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p release-assets
        TAG="${GITHUB_REF_NAME}"
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -E 'UniversalPluginUpdater-(Bukkit|Bukkit-compatible|Bungee|Velocity)\.jar' | while read filename; do
          echo "正在下载 $filename"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "$filename" -D release-assets
        done
        echo "附件下载完成"
        ls -lh release-assets/

    - name: Get all Minecraft versions from Modrinth
      id: mc_versions
      run: |
        curl -s 'https://api.modrinth.com/v2/tag/game_version' > mc_versions.json
        jq -r '[.[] | select(.version | test("^[1-9][0-9]*\\.[0-9]+(\\.[0-9]+)?$")) | .version] | map(select(. >= "1.0"))' mc_versions.json | jq -c . > filtered_mc_versions.json
        echo "版本号列表："
        cat filtered_mc_versions.json
        echo "game_versions=$(cat filtered_mc_versions.json)" >> $GITHUB_OUTPUT

    - name: Set release type
      id: set_type
      run: |
        gh_title="${{ github.event.release.name }}"
        lower_title="$(echo "$gh_title" | tr '[:upper:]' '[:lower:]')"
        if echo "$lower_title" | grep -q "pre"; then
          echo "release_type=alpha" >> $GITHUB_OUTPUT
        elif echo "$lower_title" | grep -q "rc"; then
          echo "release_type=beta" >> $GITHUB_OUTPUT
        else
          echo "release_type=release" >> $GITHUB_OUTPUT
        fi

        
    - name: Modrinth Publish - Bukkit
      uses: cloudnode-pro/modrinth-publish@v2.1.3
      with:
        token: ${{ secrets.MODRINTH_TOKEN }}
        project: ${{ secrets.MODRINTH_PROJECT_ID }}
        name: ${{ steps.variables.outputs.version }}
        version: ${{ steps.variables.outputs.version_code }}-Bukkit
        channel: ${{ steps.set_type.outputs.release_type }}
        changelog: ${{ github.event.release.body }}
        loaders: '["bukkit","folia","paper","purpur","spigot"]'
        files: |-
          release-assets/UniversalPluginUpdater-Bukkit.jar
          release-assets/UniversalPluginUpdater-Bukkit-compatible.jar
        game-versions: ${{ steps.mc_versions.outputs.game_versions }}
        primary-file: 'UniversalPluginUpdater-Bukkit.jar'
        
    - name: Modrinth Publish - Bungee
      uses: cloudnode-pro/modrinth-publish@v2.1.3
      with:
        token: ${{ secrets.MODRINTH_TOKEN }}
        project: ${{ secrets.MODRINTH_PROJECT_ID }}
        name: ${{ steps.variables.outputs.version }}
        version: ${{ steps.variables.outputs.version_code }}-Bungee
        channel: ${{ steps.set_type.outputs.release_type }}
        changelog: ${{ github.event.release.body }}
        loaders: '["bungeecord","waterfall"]'
        files: release-assets/UniversalPluginUpdater-Bungee.jar
        game-versions: ${{ steps.mc_versions.outputs.game_versions }}
        primary-file: 'UniversalPluginUpdater-Bungee.jar'
    
    - name: Modrinth Publish - Velocity
      uses: cloudnode-pro/modrinth-publish@v2.1.3
      with:
        token: ${{ secrets.MODRINTH_TOKEN }}
        project: ${{ secrets.MODRINTH_PROJECT_ID }}
        name: ${{ steps.variables.outputs.version }}
        version: ${{ steps.variables.outputs.version_code }}-Velocity
        channel: ${{ steps.set_type.outputs.release_type }}
        changelog: ${{ github.event.release.body }}
        loaders: '["velocity"]'
        files: release-assets/UniversalPluginUpdater-Velocity.jar
        game-versions: ${{ steps.mc_versions.outputs.game_versions }}
        primary-file: 'UniversalPluginUpdater-Velocity.jar'

    - name: Clean up
      run: rm -rf release-assets version.json mc_versions.json filtered_mc_versions.json