verbose: false
# Language: system, zh-Hans, en-US, ja-JP (ja is also accepted)
language: system

platform:
  name: null
  game-versions: null
  loaders: null

updater:
  strategy: native
  allow-upgrade-now: true
  filename: ${originName}
  force-filename: false
  # Optional strategy: backup (shutdown by default; --now replaces files immediately)
  backup:
    directory: .disabled
  proxy:
    uri: ~
    username: ~
    password: ~
  repository:
    check-mode: 1
    check-list:
      - DEFAULT_MODE_IS_BLACKLIST
  plugin-list:
    - DEFAULT_MODE_IS_BLACKLIST
  plugin-list-mode: 1